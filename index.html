<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Time Zone Converter</title>
    <style>
      :root {
        --bg: #f4f2ec;
        --panel: #fffdf8;
        --panel-to: #eef4f1;
        --ink: #22302c;
        --ink-soft: #54645e;
        --line: #ddd6c8;
        --accent: #14665a;
        --accent-ink: #ffffff;
        --accent-soft: #dcebe5;
        --chip: #f3e3bb;
        --chip-ink: #5c430a;
        --focus: #14665a;
        --shadow: 0 1px 2px rgba(34, 48, 44, 0.06), 0 8px 24px rgba(34, 48, 44, 0.07);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #131918;
          --panel: #1c2422;
          --panel-to: #1a2a26;
          --ink: #e8edea;
          --ink-soft: #a7b5af;
          --line: #33413d;
          --accent: #3d9c8a;
          --accent-ink: #0d1514;
          --accent-soft: #24443d;
          --chip: #4a3a14;
          --chip-ink: #f0d488;
          --focus: #7fc8b8;
          --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35);
        }
      }

      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        line-height: 1.5;
      }

      .home-pill {
        position: fixed;
        top: max(12px, env(safe-area-inset-top));
        left: 12px;
        z-index: 10;
        display: inline-flex;
        align-items: center;
        min-height: 40px;
        padding: 6px 16px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--panel);
        color: var(--ink);
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
        box-shadow: var(--shadow);
      }
      .home-pill:hover { border-color: var(--accent); color: var(--accent); }

      .wrap {
        max-width: 880px;
        margin: 0 auto;
        padding: 76px 18px 48px;
      }

      header { text-align: center; margin-bottom: 28px; }
      h1 {
        margin: 0 0 8px;
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
        font-size: clamp(30px, 6vw, 42px);
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      .intro {
        margin: 0 auto;
        max-width: 34em;
        color: var(--ink-soft);
        font-size: 17px;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: var(--shadow);
        padding: 20px;
      }

      .pickers {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 14px;
        align-items: end;
      }
      .picker label,
      .moment label {
        display: block;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-soft);
        margin-bottom: 6px;
      }
      .picker input[type="search"],
      .picker select,
      .moment input {
        width: 100%;
        min-height: 52px;
        padding: 10px 12px;
        font-size: 16px;
        font-family: inherit;
        color: var(--ink);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      .picker input[type="search"] {
        min-height: 44px;
        margin-bottom: 8px;
        border-radius: 10px;
      }
      .picker select { appearance: auto; }
      :focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }

      .swap-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 52px;
        padding: 10px 18px;
        border: none;
        border-radius: 999px;
        background: var(--accent);
        color: var(--accent-ink);
        font-size: 16px;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
        white-space: nowrap;
      }
      .swap-btn:active { transform: scale(0.97); }
      .swap-btn svg { flex: none; }

      .moment {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px 12px;
        margin-top: 20px;
        align-items: end;
      }
      .moment input { min-width: 0; }
      .moment label { grid-column: 1 / -1; margin-bottom: 0; }
      .now-btn {
        min-height: 52px;
        padding: 10px 22px;
        border: 1px solid var(--accent);
        border-radius: 10px;
        background: var(--accent-soft);
        color: var(--ink);
        font-size: 16px;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
      }
      .now-btn[aria-pressed="true"] {
        background: var(--accent);
        color: var(--accent-ink);
      }

      .results {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        margin-top: 16px;
      }
      .result-card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: var(--shadow);
        padding: 20px;
        min-width: 0;
      }
      .result-card.to { background: var(--panel-to); }
      .result-place {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-soft);
        margin: 0 0 4px;
        overflow-wrap: anywhere;
      }
      .result-time {
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
        font-size: clamp(34px, 7.5vw, 52px);
        font-weight: 600;
        line-height: 1.1;
        margin: 0;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .result-time .secs { font-size: 0.55em; color: var(--ink-soft); }
      .result-time .abbr { font-size: 0.42em; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
      .result-date {
        margin: 6px 0 0;
        font-size: 16px;
        color: var(--ink-soft);
      }
      .day-chip {
        display: none;
        margin-top: 12px;
        padding: 4px 12px;
        border-radius: 999px;
        background: var(--chip);
        color: var(--chip-ink);
        font-size: 14px;
        font-weight: 700;
      }
      .day-chip.show { display: inline-block; }

      .diff-line {
        margin: 22px auto 0;
        max-width: 36em;
        text-align: center;
        font-size: 19px;
        font-weight: 600;
      }
      .fineprint {
        margin: 26px auto 0;
        text-align: center;
        font-size: 13.5px;
        color: var(--ink-soft);
      }

      @media (max-width: 640px) {
        .wrap { padding-top: 68px; }
        .pickers { grid-template-columns: 1fr; align-items: stretch; }
        .swap-btn { justify-self: center; }
        .swap-btn svg { transform: rotate(90deg); }
        .results { grid-template-columns: 1fr; }
        .moment { grid-template-columns: 1fr; }
        .now-btn { width: 100%; }
      }
    </style>
  </head>
  <body>
    <a class="home-pill" href="https://jesuslovestyler.com/">⌂ Home</a>

    <main class="wrap">
      <header>
        <h1>Time Zone Converter</h1>
        <p class="intro">Friends and family scattered across the world? Pick two places and see what time it is — or will be — for both of you, side by side.</p>
      </header>

      <section class="card" aria-label="Choose places and a moment">
        <div class="pickers">
          <div class="picker">
            <label for="fromSearch">From</label>
            <input type="search" id="fromSearch" placeholder="Search places…" autocomplete="off" />
            <select id="fromSelect" aria-label="From place"></select>
          </div>

          <button class="swap-btn" id="swapBtn" type="button" aria-label="Swap From and To places">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 7h13" /><path d="M14 3.5 17.5 7 14 10.5" />
              <path d="M20 17H7" /><path d="M10 13.5 6.5 17 10 20.5" />
            </svg>
            Swap
          </button>

          <div class="picker">
            <label for="toSearch">To</label>
            <input type="search" id="toSearch" placeholder="Search places…" autocomplete="off" />
            <select id="toSelect" aria-label="To place"></select>
          </div>
        </div>

        <div class="moment">
          <label for="whenInput">Date &amp; time — in the From place</label>
          <input type="datetime-local" id="whenInput" />
          <button class="now-btn" id="nowBtn" type="button" aria-pressed="true">Now</button>
        </div>
      </section>

      <section class="results" aria-label="Converted times">
        <div class="result-card from">
          <p class="result-place" id="fromPlace">From</p>
          <p class="result-time" id="fromTime">–</p>
          <p class="result-date" id="fromDate">–</p>
        </div>
        <div class="result-card to">
          <p class="result-place" id="toPlace">To</p>
          <p class="result-time" id="toTime">–</p>
          <p class="result-date" id="toDate">–</p>
          <span class="day-chip" id="dayChip"></span>
        </div>
      </section>

      <p class="diff-line" id="diffLine" aria-live="polite"></p>

      <p class="fineprint">Everything is worked out right here on your device — nothing you pick is sent anywhere.</p>
    </main>

    <script>
      (function () {
        "use strict";

        // ---------- Zone list (built into the browser — no external data) ----------
        var FALLBACK_ZONES = [
          "UTC", "America/New_York", "America/Chicago", "America/Denver",
          "America/Los_Angeles", "America/Anchorage", "Pacific/Honolulu",
          "America/Toronto", "America/Mexico_City", "America/Sao_Paulo",
          "Europe/London", "Europe/Paris", "Europe/Moscow", "Africa/Cairo",
          "Asia/Dubai", "Asia/Karachi", "Asia/Dhaka", "Asia/Bangkok",
          "Asia/Manila", "Asia/Shanghai", "Asia/Tokyo", "Australia/Sydney",
          "Pacific/Auckland"
        ];
        var zones;
        try {
          zones = Intl.supportedValuesOf("timeZone").slice();
        } catch (e) {
          zones = FALLBACK_ZONES.slice();
        }
        if (zones.indexOf("UTC") === -1) zones.unshift("UTC");

        var localZone = "UTC";
        try {
          localZone = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";
        } catch (e) { /* keep UTC */ }
        if (zones.indexOf(localZone) === -1) zones.unshift(localZone);
        zones.sort(function (a, b) {
          if (a === "UTC") return -1;
          if (b === "UTC") return 1;
          return a < b ? -1 : a > b ? 1 : 0;
        });

        // Friendly names: "America/Argentina/Buenos_Aires" -> "Buenos Aires (Argentina, America)"
        function friendlyName(tz) {
          if (tz === "UTC") return "UTC";
          var parts = tz.split("/");
          var city = parts[parts.length - 1].replace(/_/g, " ");
          var region = parts.slice(0, -1).map(function (s) { return s.replace(/_/g, " "); }).join(", ");
          return region ? city + " (" + region + ")" : city;
        }
        function cityName(tz) {
          if (tz === "UTC") return "UTC";
          var parts = tz.split("/");
          return parts[parts.length - 1].replace(/_/g, " ");
        }

        // ---------- State ----------
        var fromZone = localZone;
        var toZone = (fromZone === "Asia/Manila") ? "America/New_York" : "Asia/Manila";
        if (zones.indexOf(toZone) === -1) toZone = zones[0] === fromZone ? zones[1] : zones[0];
        var instant = new Date();
        var liveMode = true;

        // ---------- Elements ----------
        var fromSearch = document.getElementById("fromSearch");
        var toSearch = document.getElementById("toSearch");
        var fromSelect = document.getElementById("fromSelect");
        var toSelect = document.getElementById("toSelect");
        var whenInput = document.getElementById("whenInput");
        var nowBtn = document.getElementById("nowBtn");
        var swapBtn = document.getElementById("swapBtn");
        var fromPlace = document.getElementById("fromPlace");
        var toPlace = document.getElementById("toPlace");
        var fromTime = document.getElementById("fromTime");
        var toTime = document.getElementById("toTime");
        var fromDate = document.getElementById("fromDate");
        var toDate = document.getElementById("toDate");
        var dayChip = document.getElementById("dayChip");
        var diffLine = document.getElementById("diffLine");

        // ---------- Picker plumbing ----------
        function fillSelect(select, selected, filter) {
          var f = (filter || "").trim().toLowerCase();
          select.innerHTML = "";
          var pinned = null;
          zones.forEach(function (tz) {
            var name = friendlyName(tz);
            var matches = !f || name.toLowerCase().indexOf(f) !== -1 || tz.toLowerCase().indexOf(f) !== -1;
            if (tz === selected && !matches) { pinned = tz; return; }
            if (!matches) return;
            var opt = document.createElement("option");
            opt.value = tz;
            opt.textContent = name;
            select.appendChild(opt);
          });
          if (pinned) {
            var opt2 = document.createElement("option");
            opt2.value = pinned;
            opt2.textContent = friendlyName(pinned);
            select.insertBefore(opt2, select.firstChild);
          }
          select.value = selected;
        }

        function wirePicker(searchEl, selectEl, getZone, setZone) {
          searchEl.addEventListener("input", function () {
            fillSelect(selectEl, getZone(), searchEl.value);
          });
          searchEl.addEventListener("keydown", function (ev) {
            if (ev.key === "Enter") {
              ev.preventDefault();
              if (selectEl.options.length) {
                setZone(selectEl.options[0].value);
                fillSelect(selectEl, getZone(), "");
                searchEl.value = "";
                render();
              }
            }
          });
          selectEl.addEventListener("change", function () {
            setZone(selectEl.value);
            render();
          });
        }

        // ---------- Time zone math (all via Intl.DateTimeFormat) ----------
        var partsFmtCache = {};
        function partsIn(tz, date) {
          var fmt = partsFmtCache[tz];
          if (!fmt) {
            fmt = new Intl.DateTimeFormat("en-US", {
              timeZone: tz, hourCycle: "h23",
              year: "numeric", month: "2-digit", day: "2-digit",
              hour: "2-digit", minute: "2-digit", second: "2-digit"
            });
            partsFmtCache[tz] = fmt;
          }
          var p = {};
          var list = fmt.formatToParts(date);
          for (var i = 0; i < list.length; i++) p[list[i].type] = list[i].value;
          return {
            year: +p.year, month: +p.month, day: +p.day,
            hour: (+p.hour) % 24, minute: +p.minute, second: +p.second
          };
        }
        // Offset of tz at instant `date`, in ms (wall clock minus UTC).
        function offsetMs(tz, date) {
          var p = partsIn(tz, date);
          var wallAsUTC = Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute, p.second);
          return wallAsUTC - Math.floor(date.getTime() / 1000) * 1000;
        }
        // The instant whose wall-clock time in tz is the given fields.
        function instantFromWall(tz, y, mo, d, h, mi) {
          var guess = Date.UTC(y, mo - 1, d, h, mi, 0);
          var inst = guess - offsetMs(tz, new Date(guess));
          inst = guess - offsetMs(tz, new Date(inst)); // refine across DST edges
          return new Date(inst);
        }
        function pad2(n) { return (n < 10 ? "0" : "") + n; }
        function inputValueFor(tz, date) {
          var p = partsIn(tz, date);
          return p.year + "-" + pad2(p.month) + "-" + pad2(p.day) + "T" + pad2(p.hour) + ":" + pad2(p.minute);
        }

        var displayFmtCache = {};
        function displayIn(tz, date) {
          var entry = displayFmtCache[tz];
          if (!entry) {
            entry = {
              time: new Intl.DateTimeFormat("en-US", {
                timeZone: tz, hour: "numeric", minute: "2-digit", second: "2-digit",
                hour12: true, timeZoneName: "short"
              }),
              date: new Intl.DateTimeFormat("en-US", {
                timeZone: tz, weekday: "long", month: "long", day: "numeric", year: "numeric"
              })
            };
            displayFmtCache[tz] = entry;
          }
          var main = "", secs = "", abbr = "";
          var parts = entry.time.formatToParts(date);
          var i;
          for (i = 0; i < parts.length; i++) {
            if (parts[i].type === "second") secs = parts[i].value;
            if (parts[i].type === "timeZoneName") abbr = parts[i].value;
          }
          // Build "h:mm AM" — hour:minute plus AM/PM, without seconds or abbreviation.
          var seenMinute = false;
          for (i = 0; i < parts.length; i++) {
            var q = parts[i];
            if (q.type === "second" || q.type === "timeZoneName") continue;
            if (q.type === "literal" && q.value === ":" && seenMinute) continue;
            if (q.type === "minute") seenMinute = true;
            main += q.value;
          }
          return { main: main.trim(), secs: secs, abbr: abbr, date: entry.date.format(date) };
        }

        function durationText(totalMinutes) {
          var abs = Math.abs(totalMinutes);
          var h = Math.floor(abs / 60);
          var m = abs % 60;
          var parts = [];
          if (h) parts.push(h + (h === 1 ? " hour" : " hours"));
          if (m) parts.push(m + (m === 1 ? " minute" : " minutes"));
          return parts.length ? parts.join(" ") : "0 minutes";
        }

        // ---------- Render ----------
        function render() {
          var f = displayIn(fromZone, instant);
          var t = displayIn(toZone, instant);

          fromPlace.textContent = "From · " + friendlyName(fromZone);
          toPlace.textContent = "To · " + friendlyName(toZone);

          fromTime.innerHTML = "";
          fromTime.appendChild(document.createTextNode(f.main.replace(/\s?[AP]M$/, "")));
          var fSecs = document.createElement("span");
          fSecs.className = "secs";
          fSecs.textContent = ":" + f.secs;
          fromTime.appendChild(fSecs);
          fromTime.appendChild(document.createTextNode(" " + (f.main.match(/[AP]M/) ? f.main.match(/[AP]M/)[0] : "")));
          if (f.abbr) {
            fromTime.appendChild(document.createTextNode(" "));
            var fAbbr = document.createElement("span");
            fAbbr.className = "abbr";
            fAbbr.textContent = f.abbr;
            fromTime.appendChild(fAbbr);
          }

          toTime.innerHTML = "";
          toTime.appendChild(document.createTextNode(t.main.replace(/\s?[AP]M$/, "")));
          var tSecs = document.createElement("span");
          tSecs.className = "secs";
          tSecs.textContent = ":" + t.secs;
          toTime.appendChild(tSecs);
          toTime.appendChild(document.createTextNode(" " + (t.main.match(/[AP]M/) ? t.main.match(/[AP]M/)[0] : "")));
          if (t.abbr) {
            toTime.appendChild(document.createTextNode(" "));
            var tAbbr = document.createElement("span");
            tAbbr.className = "abbr";
            tAbbr.textContent = t.abbr;
            toTime.appendChild(tAbbr);
          }

          fromDate.textContent = f.date;
          toDate.textContent = t.date;

          // Day difference between the two places at this moment
          var fp = partsIn(fromZone, instant);
          var tp = partsIn(toZone, instant);
          var dayDiff = Math.round(
            (Date.UTC(tp.year, tp.month - 1, tp.day) - Date.UTC(fp.year, fp.month - 1, fp.day)) / 86400000
          );
          if (dayDiff === 1) { dayChip.textContent = "Tomorrow there"; dayChip.className = "day-chip show"; }
          else if (dayDiff === -1) { dayChip.textContent = "Yesterday there"; dayChip.className = "day-chip show"; }
          else if (dayDiff > 1) { dayChip.textContent = dayDiff + " days later there"; dayChip.className = "day-chip show"; }
          else if (dayDiff < -1) { dayChip.textContent = Math.abs(dayDiff) + " days earlier there"; dayChip.className = "day-chip show"; }
          else { dayChip.textContent = ""; dayChip.className = "day-chip"; }

          // Plain-language difference
          var diffMin = Math.round((offsetMs(toZone, instant) - offsetMs(fromZone, instant)) / 60000);
          var toCity = cityName(toZone);
          var fromCity = cityName(fromZone);
          if (diffMin === 0) {
            diffLine.textContent = toCity + " and " + fromCity + " are on the same time right now.";
          } else if (diffMin > 0) {
            diffLine.textContent = toCity + " is " + durationText(diffMin) + " ahead of " + fromCity + ".";
          } else {
            diffLine.textContent = toCity + " is " + durationText(diffMin) + " behind " + fromCity + ".";
          }

          whenInput.value = inputValueFor(fromZone, instant);
          nowBtn.setAttribute("aria-pressed", liveMode ? "true" : "false");
          nowBtn.textContent = liveMode ? "Now ✓" : "Now";
        }

        // ---------- Events ----------
        wirePicker(fromSearch, fromSelect, function () { return fromZone; }, function (z) { fromZone = z; });
        wirePicker(toSearch, toSelect, function () { return toZone; }, function (z) { toZone = z; });

        whenInput.addEventListener("change", function () {
          if (!whenInput.value) { render(); return; }
          var bits = whenInput.value.split("T");
          if (bits.length !== 2) return;
          var d = bits[0].split("-"), t = bits[1].split(":");
          var parsed = instantFromWall(fromZone, +d[0], +d[1], +d[2], +t[0], +t[1]);
          if (!isNaN(parsed.getTime())) {
            instant = parsed;
            liveMode = false;
            render();
          }
        });

        nowBtn.addEventListener("click", function () {
          liveMode = true;
          instant = new Date();
          render();
        });

        swapBtn.addEventListener("click", function () {
          var tmp = fromZone;
          fromZone = toZone;
          toZone = tmp;
          fillSelect(fromSelect, fromZone, "");
          fillSelect(toSelect, toZone, "");
          fromSearch.value = "";
          toSearch.value = "";
          render(); // same instant, re-expressed from the new From place
        });

        fillSelect(fromSelect, fromZone, "");
        fillSelect(toSelect, toZone, "");
        render();

        // Keep the clock ticking while we're showing "now".
        setInterval(function () {
          if (liveMode) {
            instant = new Date();
            render();
          }
        }, 1000);
      })();
    </script>
    <script data-goatcounter="https://jesuslovestyler.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  </body>
</html>
